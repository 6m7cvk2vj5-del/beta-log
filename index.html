<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Beta Log &mdash; Training Coach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{
    --bg:#211F26; --surface:#2A2831; --surface2:#37343D; --border:#4A4650;
    --text:#F3EFE8; --muted:#ACA79E; --gold:#CC9B3C; --teal:#4E8C87; --red:#D97C6E; --gold-ink:#1A1508;
  }
  html{font-size:16px;} /* overridden inline by the font-size setting; every size below is in rem so it scales with this */
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  header.top{margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand svg{flex:none;}
  .brand h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:1.625rem;letter-spacing:1px;margin:0;}
  .tagline{color:var(--muted);font-size:0.8rem;margin:2px 0 0 28px;}
  nav.tabs{display:flex;gap:14px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
  nav.tabs button{background:none;border:none;color:var(--muted);font-size:0.9rem;font-weight:600;padding:8px 2px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;}
  nav.tabs button.active{color:var(--text);border-bottom-color:var(--gold);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h2{font-family:'Big Shoulders Display',sans-serif;font-size:1.1rem;font-weight:700;margin:0 0 12px;letter-spacing:.3px;}
  .card h3{font-size:0.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  input[type=range]{width:100%;accent-color:var(--gold);height:22px;}
  input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{
    width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:inherit;
  }
  textarea{min-height:60px;resize:vertical;}
  .pillrow{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:7px 13px;color:var(--text);font-size:0.85rem;cursor:pointer;font-family:inherit;}
  .pill.sm{padding:6px 11px;font-size:0.8rem;}
  .pill.active{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600;}
  .pill.active.alt{background:var(--teal);border-color:var(--teal);color:#0D1C1B;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:8px;
    padding:12px 16px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--gold);color:var(--gold-ink);}
  .btn-secondary{background:transparent;color:var(--text);border:1px solid var(--gold);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);font-weight:500;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;}
  .muted{color:var(--muted);}
  .small{font-size:0.8rem;}
  .banner{border-radius:10px;padding:12px 14px;font-size:0.85rem;margin-bottom:14px;border:1px solid;}
  .banner.info{background:rgba(204,155,60,.14);border-color:var(--gold);}
  .banner.warn{background:rgba(217,124,110,.16);border-color:var(--red);}
  .phase-banner{display:flex;justify-content:space-between;align-items:center;}
  .phase-name{font-family:'Big Shoulders Display',sans-serif;font-size:1.25rem;font-weight:800;}
  .plan-box{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:0.85rem;line-height:1.6;margin-top:10px;}
  .plan-editable{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:0.85rem;}
  .plan-header{font-weight:600;color:var(--gold);margin:10px 0 4px;font-size:0.85rem;}
  .plan-header:first-child{margin-top:0;}
  .plan-plain{color:var(--text);line-height:1.6;white-space:pre-wrap;}
  .plan-line{display:flex;align-items:center;gap:8px;padding:3px 0;line-height:1.5;}
  .plan-line-text{flex:1;}
  .plan-line-controls{display:flex;gap:2px;flex:none;}
  .plan-line-controls button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;
    width:22px;height:22px;font-size:0.75rem;cursor:pointer;padding:0;line-height:1;}
  .plan-line-controls button:active{background:var(--border);}
  .ex-link{color:var(--gold);text-decoration:underline;text-decoration-style:dotted;cursor:pointer;}
  .ex-link:active{color:var(--teal);}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .barlist .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:0.8rem;}
  .barlist .bar-label{width:110px;flex:none;color:var(--muted);}
  .barlist .bar-track{flex:1;background:var(--surface2);border-radius:4px;height:14px;overflow:hidden;}
  .barlist .bar-fill{height:100%;background:var(--teal);}
  .barlist .bar-val{width:28px;text-align:right;flex:none;}
  .entry{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  .entry-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--surface2);
    border:none;color:var(--text);padding:10px 12px;cursor:pointer;font-size:0.8rem;font-family:inherit;}
  .entry-body{padding:10px 12px;font-size:0.8rem;}
  .entry-body p{margin:4px 0;}
  .heatgrid{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;}
  .heatcol{display:flex;flex-direction:column;gap:3px;}
  .heatcell{width:11px;height:11px;border-radius:3px;border:1px solid var(--border);}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat{background:var(--surface2);border-radius:8px;padding:10px;text-align:center;}
  .stat .num{font-family:'Big Shoulders Display',sans-serif;font-size:1.375rem;font-weight:800;color:var(--gold);}
  .stat .lbl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .q-item{border-bottom:1px solid var(--border);padding:12px 0;}
  .q-item:last-child{border-bottom:none;}
  .q-text{font-size:0.85rem;margin-bottom:8px;}
  .scale-row{display:flex;gap:4px;}
  .scale-btn{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 0;
    text-align:center;font-size:0.75rem;cursor:pointer;color:var(--muted);font-family:inherit;}
  .scale-btn.active{background:var(--teal);border-color:var(--teal);color:#0D1C1B;font-weight:700;}
  .scale-caption{display:flex;justify-content:space-between;font-size:0.625rem;color:var(--muted);margin-top:4px;}
  a{color:var(--gold);}
  .close-x{background:none;border:none;color:var(--muted);font-size:1.25rem;cursor:pointer;}
  .info-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
    border:1px solid var(--muted);color:var(--muted);font-size:0.65rem;font-style:italic;font-family:Georgia,serif;
    cursor:pointer;vertical-align:middle;margin-left:5px;background:none;line-height:1;padding:0;}
  .info-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
  .info-popup{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;padding:18px 16px 28px;
    max-width:520px;width:100%;box-sizing:border-box;}
  .info-popup .close-x{float:right;margin:-6px -4px 0 0;}
  .info-popup p{font-size:0.85rem;line-height:1.6;margin:8px 0 0;color:var(--text);}
  .timer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
    padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:40;max-width:520px;margin:0 auto;box-sizing:border-box;}
  .timer-presets{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
  .timer-spacer{height:78px;}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);
    padding:10px 18px;border-radius:999px;font-size:0.8rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  #toast.show{opacity:1;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CC9B3C" stroke-width="2.2"><path d="M8 3l4 8 5-5 5 15H2L8 3z"/></svg>
      <h1>BETA LOG</h1>
    </div>
    <p class="tagline">your training, stacked into a route</p>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="log">Log Session</button>
    <button data-tab="history">History</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <main id="panels"></main>
</div>
<div id="infoOverlay"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
